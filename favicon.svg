<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" rx="80" fill="#0a0a0f"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g stroke="#BFFF00" stroke-width="6" fill="none" stroke-linejoin="miter">
      <rect x="140" y="80" width="100" height="60" rx="6" ry="6"/>
      <rect x="240" y="100" width="14" height="20" rx="3" ry="3" fill="#BFFF00" stroke="none"/>
      <polygon points="180,90 198,118 188,118 204,148 184,122 194,122" fill="#BFFF00" stroke="none"/>
    </g>
  </g>
</svg>
